name: Reisehinweise aktualisieren

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pycountry==24.6.1
      - run: python tools/advisories.py data/advisories.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add data/advisories.json data/advice
          git diff --cached --quiet || (git commit -m "Reisehinweise aktualisiert" && git pull --rebase && git push)
