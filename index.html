<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f7f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Viaro">
  <title>Viaro</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b7285'/%3E%3Cpath d='M18 20l14 26 14-26' fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" integrity="sha256-YU3qCpj/P06tdPBJGPax0bm6Q1wltfwjsho5TR4+TYc=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" integrity="sha256-qx5w1Z7EBGW65+cDDaLzzPKBM/1QLmK9WY7vut/XpzI=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="map" class="map" role="region" data-i18n-attr="aria-label:map.label"></div>

  <div class="progress" id="progress" hidden></div>

  <header class="topbar" id="topbar">
    <form class="search" id="search-form" role="search" autocomplete="off">
      <button type="button" class="icon-btn" id="menu-btn" aria-controls="drawer" aria-expanded="false" data-i18n-attr="aria-label:menu.open">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <input class="search__input" id="search-input" type="search" enterkeyhint="search" spellcheck="false" autocapitalize="words" data-i18n-attr="placeholder:search.placeholder;aria-label:search.placeholder">
      <button type="button" class="icon-btn" id="search-clear" hidden data-i18n-attr="aria-label:search.clear">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
      </button>
      <button type="submit" class="icon-btn icon-btn--accent" id="search-submit" data-i18n-attr="aria-label:search.submit">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      </button>
    </form>
    <div class="search-panel" id="search-panel" hidden>
      <p class="search-panel__message" id="search-message" role="status"></p>
      <ul class="search-panel__list" id="search-results" data-i18n-attr="aria-label:search.resultsLabel"></ul>
    </div>
  </header>

  <button type="button" class="area-btn" id="area-btn">
    <span class="spinner" aria-hidden="true"></span>
    <svg class="area-btn__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
    <span id="area-label"></span>
  </button>

  <div class="fab-stack" id="fab-stack">
    <button type="button" class="fab" id="layers-btn" aria-controls="layers" aria-expanded="false" data-i18n-attr="aria-label:layers.button;title:layers.button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 4 8.5 4.5L12 13 3.5 8.5 12 4z"/><path d="m3.5 12.5 8.5 4.5 8.5-4.5"/><path d="m3.5 16.5 8.5 4.5 8.5-4.5"/></svg>
    </button>
    <button type="button" class="fab" id="locate-btn" data-i18n-attr="aria-label:locate.button;title:locate.button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22"/></svg>
    </button>
  </div>

  <section class="layers" id="layers" hidden>
    <h2 class="layers__title" data-i18n="layers.title"></h2>
    <div class="layers__group" id="layers-base"></div>
    <h3 class="layers__subtitle" data-i18n="layers.more"></h3>
    <div class="layers__group" id="layers-extra"></div>
    <p class="layers__hint" data-i18n="layers.hint"></p>
  </section>

  <section class="sheet" id="sheet" data-state="peek">
    <div class="sheet__header" id="sheet-header" role="button" tabindex="0" aria-controls="sheet-body" aria-expanded="false" data-i18n-attr="aria-label:sheet.toggle">
      <span class="sheet__handle" aria-hidden="true"></span>
      <div class="sheet__title-row">
        <h2 class="sheet__title" id="sheet-title"></h2>
        <span class="sheet__count" id="results-count"></span>
      </div>
    </div>
    <div class="tabs" id="sheet-tabs" role="tablist">
      <button type="button" class="tab" id="tab-stays" role="tab" aria-selected="true" aria-controls="sheet-body" data-tab="stays">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19v-9"/><path d="M3 15h18v4"/><path d="M21 15v-2.5A3.5 3.5 0 0 0 17.5 9H11v6"/><circle cx="7" cy="12" r="1.8"/></svg>
        <span data-i18n="tabs.stays"></span>
      </button>
      <button type="button" class="tab" id="tab-route" role="tab" aria-selected="false" aria-controls="route-body" data-tab="route">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/></svg>
        <span data-i18n="tabs.route"></span>
      </button>
      <button type="button" class="tab" id="tab-discover" role="tab" aria-selected="false" aria-controls="discover-body" data-tab="discover">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>
        <span data-i18n="tabs.discover"></span>
      </button>
    </div>
    <div class="chips" id="chips" role="toolbar" data-i18n-attr="aria-label:filter.label"></div>
    <div class="sheet__body" id="sheet-body">
      <div class="list-toolbar" id="list-toolbar" hidden>
        <label class="list-toolbar__label" for="results-sort" data-i18n="sort.label"></label>
        <select class="select select--compact" id="results-sort"></select>
      </div>
      <p class="empty" id="results-empty"></p>
      <div class="recent" id="recent" hidden></div>
      <div class="retry-row"><button type="button" class="btn btn--secondary" id="results-retry" hidden data-i18n="common.retry"></button></div>
      <ul class="place-list" id="results-list" data-i18n-attr="aria-label:results.listLabel"></ul>
    </div>
    <div class="sheet__body" id="route-body" hidden></div>
    <div class="sheet__body" id="discover-body" hidden></div>
  </section>

  <div class="scrim" id="scrim" hidden></div>

  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-hidden="true" inert>
    <div class="drawer__head">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M6 6.5l6 11 6-11"/></svg>
        </span>
        <span class="brand__text">
          <span class="brand__name" data-i18n="app.name"></span>
          <span class="brand__tagline" data-i18n="app.tagline"></span>
        </span>
      </div>
      <button type="button" class="icon-btn" id="drawer-close" data-i18n-attr="aria-label:menu.close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
      </button>
    </div>
    <div class="drawer__body">
      <section class="drawer__section">
        <div class="section-head">
          <h2 class="section-title" data-i18n="favorites.title"></h2>
          <span class="badge" id="favorites-count"></span>
        </div>
        <label class="switch-row">
          <span data-i18n="favorites.showOnMap"></span>
          <input type="checkbox" class="switch" id="favorites-toggle">
        </label>
        <label class="select-row">
          <span data-i18n="favorites.sort"></span>
          <select class="select" id="favorites-sort"></select>
        </label>
        <p class="empty empty--compact" id="favorites-empty"></p>
        <ul class="place-list place-list--drawer" id="favorites-list"></ul>
      </section>
      <section class="drawer__section">
        <h2 class="section-title" data-i18n="settings.language"></h2>
        <div class="segmented" id="language-switch" role="group" data-i18n-attr="aria-label:settings.language"></div>
      </section>
      <section class="drawer__section">
        <h2 class="section-title" data-i18n="settings.appearance"></h2>
        <div class="segmented" id="theme-switch" role="group" data-i18n-attr="aria-label:settings.appearance"></div>
      </section>
      <section class="drawer__section drawer__section--about">
        <h2 class="section-title" data-i18n="about.title"></h2>
        <dl class="sources" id="sources"></dl>
        <p class="about-note" data-i18n="about.note"></p>
      </section>
    </div>
  </aside>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" integrity="sha256-Hk4dIpcqOSb0hZjgyvFOP+cEmDXUKKNE/tT542ZbNQg=" crossorigin=""></script>
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js" integrity="sha256-RamwepGJzlYFTGIKlHzPQeKR5YyV6bYVM7dAqqZe5cs=" crossorigin=""></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js" integrity="sha256-HDM2eWLndVwaFtH4Vlj9yWtbqjb4Gt/KlJMXTNG1Js4=" crossorigin=""></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
